server:
  port: 8083

spring:
  application:
    name: user-management-service

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

flyway:
  enabled: true
  locations: classpath:db/migration,classpath:db/migration/insert
  baseline-on-migrate: true

logging:
  level:
    org.flywaydb: debug