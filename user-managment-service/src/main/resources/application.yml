server:
  port: 8081

spring:
  application:
    name: user-management-service
  rabbitmq:
      host: ${RABBITMQ_HOST:localhost}
      port: ${RABBITMQ_PORT:5672}
      username: ${RABBITMQ_USER:guest}
      password: ${RABBITMQ_PASS:guest}
      listener:
        simple:
          acknowledge-mode: AUTO
          prefetch: 10
          concurrency: 2
          max-concurrency: 8

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

flyway:
  enabled: true
  locations: classpath:db/migration,classpath:db/migration/insert
  baseline-on-migrate: true

logging:
  level:
    org.flywaydb: debug