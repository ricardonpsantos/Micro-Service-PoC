version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.12-management   # versão 3.x com plugin de gestão
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # porta para conexões AMQP (Spring Boot usa esta)
      - "15672:15672"   # painel web de administração
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
